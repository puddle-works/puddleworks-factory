id: d23122ca-0133-4c01-984c-c0b258797790
name: "@puddleworks/puddleworks-factory-build"
description: >-
  Write a first draft of a swamp app from a puddleworks.dev/app-spec/v1 spec:
  an extension whose run method takes the spec's inputs, tests for it, a
  workflow with the same inputs, the publish manifest, README, LICENSE, a
  ci.yml and a CLAUDE.md section. The spec can be a file path, an https URL or inline JSON,
  written by a person or another tool. Files go into the root of a checkout of
  the app's own repo; nothing is committed or pushed. The factory-build skill
  drives this end to end.
version: 1

inputs:
  type: object
  properties:
    spec:
      type: string
      description: >-
        The app spec: a file path, an https URL, or the spec itself as inline
        JSON. JSON or YAML. See
        https://github.com/puddle-works/puddleworks-factory/blob/main/docs/contracts/app-spec.md
    targetDir:
      type: string
      description: >-
        Absolute real path of the root of a checkout of the app's own swamp
        repo to write into: it must contain .swamp.yaml and have repository as
        its origin, and may not be the Factory's own checkout.
    repository:
      type: string
      description: >-
        https URL of the app's repo, e.g. https://github.com/example/my-app.
        Written into the manifest; the LICENSE names its owner.
    branch:
      type: string
      description: >-
        The branch the checkout must have checked out, e.g. draft/my-app.
        Blank skips the check.
      default: ""
    specDigest:
      type: string
      description: >-
        SHA-256, in hex, of the spec a person approved (sha256sum of the
        file). A spec whose text no longer matches writes nothing. Blank skips
        the check.
      default: ""
    overwrite:
      type: boolean
      description: >-
        Replace draft files that already exist. Default false: the run fails
        and writes nothing if any draft file is already there.
      default: false
    visibility:
      type: string
      enum: [public, private]
      description: >-
        Registry visibility of the drafted package. Default private, until
        someone decides to share it.
      default: private
  required:
    - spec
    - targetDir
    - repository

jobs:
  - name: build
    description: >-
      Read and check the spec, then write the draft. A spec that breaks the
      contract, or a delivery method with no workflow, writes nothing.
    dependsOn: []
    weight: 0
    steps:
      - name: render
        description: >-
          Write the draft files into targetDir and record them in the
          puddleworks-factory model's draft data.
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: puddleworks-factory
          methodName: render
          inputs:
            spec: ${{ inputs.spec }}
            targetDir: ${{ inputs.targetDir }}
            repository: ${{ inputs.repository }}
            branch: ${{ inputs.branch }}
            specDigest: ${{ inputs.specDigest }}
            overwrite: ${{ inputs.overwrite }}
            visibility: ${{ inputs.visibility }}
