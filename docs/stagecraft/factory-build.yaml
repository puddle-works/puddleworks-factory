  - scenario: already-done
    description: >-
      A recipe already answers every phrasing. The recorded answer is not
      enough: nothing is built until the person approves, building anew is
      refused, and a build result is recorded for the existing extension.
    steps:
      - record: { artifact: assessment }
        payload:
          verdict: done
          reason: The recipe github-open-prs already answers every phrasing.
          chosen: null
      - move: already-done
        expect: { refused: reuse-choice }
      - move: build
        expect: { refused: must decline }
      - record: { evidence: reuse-choice }
        payload: { answer: done }
      - move: reuse
        expect: { refused: not a recipe or workflow }
      - move: already-done
        expect: { refused: reuse-approval }
      - approve: reuse-approval
      - move: already-done
      - record: { evidence: build-result }
        payload:
          extension: "@webframp/github"
          entryPointRef: github-open-prs
          captureRunId: run-9
      - move: recorded
      - expect: { stage: reused }
