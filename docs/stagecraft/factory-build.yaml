  - scenario: approvals-voided-and-declined
    description: >-
      An approval counts only for what it was given on. A spec changed after
      its approval, or a different repo recorded after repo-creation, waits
      for a new decision; a decline blocks until the person approves again.
    steps:
      - record: { artifact: assessment }
        payload: {
          verdict: build-functionality,
          reason: nothing fits,
