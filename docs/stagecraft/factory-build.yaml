          route: build
          exists: false
      - move: create-repo
        expect: { refused: "awaiting approval 'repo-creation'" }
      - decline: repo-creation
        note: wrong name
      - move: create-repo
        expect: { refused: "'repo-creation' was declined" }
      - record: { evidence: target }
        payload:
          repository: https://github.com/puddle-works/tide-times
          checkout: /home/u/dev/tide-times
          branch: draft/tide-times
          route: build
          exists: false
      - approve: repo-creation
      - move: create-repo
      - record: { evidence: repo-created }
        payload:
