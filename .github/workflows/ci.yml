name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7 # matches swamp's bundled deno

      - name: Format
        run: deno fmt --check

      # The skill's shell blocks are tested in zsh as well as bash.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Test
        run: deno test -A --permit-no-files

      - name: Install latest Swamp
        if: hashFiles('manifest.yaml') != ''
        run: |
          curl -fsSL https://swamp-club.com/install.sh | sh -s -- -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The quality gate runs once the package has a manifest; until then
      # there is nothing to score. swamp needs a swamp-club account: a
      # collective token and the signin token issued with it.
      - name: Extension quality
        if: hashFiles('manifest.yaml') != ''
        env:
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_SIGNIN_TOKEN: ${{ secrets.SWAMP_SIGNIN_TOKEN }}
        # Fail unless every factor the CLI can score is earned and no gate
        # failed. repository-verified stays provisional until the registry
        # verifies the repo, so the local grade is B (87%) at best.
        run: |
          swamp extension quality manifest.yaml --json > quality.json
          jq -r '"quality: \(.earnedPoints)/\(.maxClientEarnablePoints) client points, grade \(.grade), \(.ifProvisionalEarned.grade) once the repo is verified"' quality.json
          jq -e '(.gateFailures | length) == 0 and .earnedPoints == .maxClientEarnablePoints' quality.json > /dev/null \
            || { jq -r '.gateFailures[], (.factors[] | select(.status == "missing" or .status == "partial") | "missing: \(.id) (\(.label))")' quality.json >&2; exit 1; }
